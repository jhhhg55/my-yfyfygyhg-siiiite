<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Вінниця — Квиток</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1c1c1e">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #121212;
      color: #ffffff;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      height: 100%;
      background-color: #1c1c1e;
      display: flex;
      flex-direction: column;
      position: relative;
      padding: 16px 16px 28px 16px;
      justify-content: space-between;
    }

    /* Top Navigation Header */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding-top: 8px;
      padding-bottom: 16px;
    }

    .back-btn {
      position: absolute;
      left: 2px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .back-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .top-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #ffffff;
    }

    /* Segmented Control (Tabs) */
    .tab-container {
      background-color: #2c2c2e;
      border-radius: 16px;
      padding: 3px;
      display: flex;
      margin-bottom: 16px;
      height: 42px;
    }

    .tab {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      border-radius: 13px;
      cursor: pointer;
    }

    .tab.active {
      background-color: #48484a;
      color: #8ce62b;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    .tab.inactive {
      color: #ffffff;
      opacity: 0.85;
    }

    /* Main Ticket Card - Светлее, слегка выпуклая и вытянутая */
    .ticket-card {
      background-color: #48484a;
      border-radius: 24px;
      padding: 20px 18px 22px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.1);
    }

    /* Header inside Card */
    .card-header {
      width: 100%;
      display: flex;
      align-items: flex-start;
      margin-bottom: 16px;
      position: relative;
    }

    .logo-box {
      width: 48px;
      height: 48px;
      background-color: #ffffff;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-right: 12px;
      flex-shrink: 0;
      padding: 3px;
      overflow: hidden;
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .info-text {
      display: flex;
      flex-direction: column;
    }

    .city-title {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 1px;
    }

    .company-name {
      font-size: 12px;
      font-weight: 500;
      color: #ffffff;
      margin-bottom: 2px;
      opacity: 0.9;
    }

    .series-text, .wagon-text {
      font-size: 12px;
      font-weight: 500;
      color: #ffffff;
      line-height: 1.35;
    }

    .series-text span, .wagon-text span {
      font-weight: 700;
    }

    .info-btn {
      position: absolute;
      right: 0;
      top: 2px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid #2f80ed;
      color: #2f80ed;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      font-family: Georgia, serif;
      font-style: italic;
      cursor: pointer;
    }

    /* QR Code Display */
    .qr-container {
      background-color: transparent;
      padding: 0;
      margin-bottom: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .qr-container img {
      display: block;
      width: 200px;
      height: 200px;
      object-fit: contain;
      border-radius: 12px;
    }

    /* Details Grid */
    .details-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      text-align: center;
      margin-bottom: 14px;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .detail-label {
      font-size: 12px;
      color: #ffffff;
      opacity: 0.75;
      margin-bottom: 3px;
      font-weight: 400;
    }

    .detail-value {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
    }

    /* Status & Dynamic Timer */
    .ticket-type {
      color: #8ce62b;
      font-size: 13.5px;
      font-weight: 600;
      margin-bottom: 6px;
      text-align: center;
    }

    .timer-display {
      color: #8ce62b;
      font-size: 26px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .middle-space {
      flex-grow: 1;
    }

    /* Bottom Scan Button - Зеленая кнопка с БЕЛЫМ текстом и иконкой */
    .scan-btn {
      width: 100%;
      background-color: #8ce62b;
      color: #ffffff;
      border: none;
      border-radius: 25px;
      height: 50px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(140, 230, 43, 0.25);
    }

    .scan-btn svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    /* Modal for Changing Carriage & Time */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-card {
      background-color: #2c2c2e;
      padding: 20px;
      border-radius: 16px;
      width: 85%;
      max-width: 320px;
    }

    .modal-card h3 {
      font-size: 16px;
      margin-bottom: 14px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 4px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 8px 12px;
      background-color: #3a3a3c;
      border: 1px solid #48484a;
      color: #fff;
      border-radius: 8px;
      font-size: 14px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .modal-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .save-btn {
      background-color: #8ce62b;
      color: #000;
    }

    .close-btn {
      background-color: #3a3a3c;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <div class="top-bar">
      <div class="back-btn" onclick="toggleFullscreen()">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </div>
      <div class="top-title">Архів</div>
    </div>

    <!-- Tabs -->
    <div class="tab-container">
      <div class="tab active">Квиток</div>
      <div class="tab inactive">Проїзний</div>
    </div>

    <!-- Ticket Card -->
    <div class="ticket-card">
      <div class="card-header">
        <div class="logo-box">
          <img src="photo_2026-09-29_19-11-19.jpg" alt="Логотип">
        </div>
        <div class="info-text">
          <div class="city-title">Вінниця</div>
          <div class="company-name">КП Вінницька транспортна компанія</div>
          <div class="series-text">Серія <span id="disp-series">794831048</span></div>
          <div class="wagon-text">Вагон <span id="disp-wagon">№064</span></div>
        </div>
        <div class="info-btn" onclick="openSettings()">i</div>
      </div>

      <!-- QR Code Image -->
      <div class="qr-container">
        <img src="Знімок екрана 2026-09-29 144743.png" alt="QR Code">
      </div>

      <!-- Ticket Meta Data -->
      <div class="details-grid">
        <div class="detail-item">
          <div class="detail-label">Дата</div>
          <div class="detail-value" id="disp-date">28.09.2026</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Час</div>
          <div class="detail-value" id="disp-time">21:15:06</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Пасажири</div>
          <div class="detail-value" id="disp-passengers">1</div>
        </div>
      </div>

      <!-- Type & Countdown -->
      <div class="ticket-type">Квиток разового використання</div>
      <div class="timer-display" id="disp-timer">59:51</div>
    </div>

    <div class="middle-space"></div>

    <!-- Scan Button -->
    <button class="scan-btn" onclick="toggleFullscreen()">
      <svg viewBox="0 0 24 24">
        <path d="M3 9V5a2 2 0 0 1 2-2h4M15 3h4a2 2 0 0 1 2 2v4M21 15v4a2 2 0 0 1-2 2h-4M9 21H5a2 2 0 0 1-2-2v-4" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Сканувати QR-код
    </button>
  </div>

  <!-- Settings Modal (Tap 'i' to edit) -->
  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <h3>Налаштування</h3>
      
      <div class="form-group">
        <label>Номер вагона:</label>
        <input type="text" id="input-wagon" value="№064">
      </div>

      <div class="form-group">
        <label>Час поїздки:</label>
        <select id="input-elapsed">
          <option value="0">Щойно куплено (60:00)</option>
          <option value="5" selected>5 хвилин тому (55:00)</option>
          <option value="10">10 хвилин тому (50:00)</option>
          <option value="15">15 хвилин тому (45:00)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Серія квитка:</label>
        <input type="text" id="input-series" value="794831048">
      </div>

      <div class="form-group">
        <label>Кількість пасажирів:</label>
        <input type="number" id="input-passengers" value="1" min="1" max="10">
      </div>

      <div class="modal-actions">
        <button class="modal-btn close-btn" onclick="closeSettings()">Закрити</button>
        <button class="modal-btn save-btn" onclick="applySettings()">Зберегти</button>
      </div>
    </div>
  </div>

  <script>
    let elapsedMinutes = 5;
    let totalSeconds = 3600 - (elapsedMinutes * 60);

    function updateDateTime() {
      const now = new Date();
      const ticketTime = new Date(now.getTime() - elapsedMinutes * 60000);

      const day = String(ticketTime.getDate()).padStart(2, '0');
      const month = String(ticketTime.getMonth() + 1).padStart(2, '0');
      const year = ticketTime.getFullYear();

      const hours = String(ticketTime.getHours()).padStart(2, '0');
      const minutes = String(ticketTime.getMinutes()).padStart(2, '0');
      const seconds = String(ticketTime.getSeconds()).padStart(2, '0');

      document.getElementById('disp-date').innerText = `${day}.${month}.${year}`;
      document.getElementById('disp-time').innerText = `${hours}:${minutes}:${seconds}`;
    }

    function startTimer() {
      setInterval(() => {
        if (totalSeconds > 0) {
          totalSeconds--;
          const m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
          const s = String(totalSeconds % 60).padStart(2, '0');
          document.getElementById('disp-timer').innerText = `${m}:${s}`;
        }
      }, 1000);
    }

    function openSettings() {
      document.getElementById('modal').style.display = 'flex';
    }

    function closeSettings() {
      document.getElementById('modal').style.display = 'none';
    }

    function applySettings() {
      const wagon = document.getElementById('input-wagon').value;
      const series = document.getElementById('input-series').value;
      const passengers = document.getElementById('input-passengers').value;
      elapsedMinutes = parseInt(document.getElementById('input-elapsed').value);

      document.getElementById('disp-wagon').innerText = wagon.startsWith('№') ? wagon : '№' + wagon;
      document.getElementById('disp-series').innerText = series;
      document.getElementById('disp-passengers').innerText = passengers;

      totalSeconds = 3600 - (elapsedMinutes * 60);
      updateDateTime();
      closeSettings();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    window.onload = function() {
      updateDateTime();
      startTimer();
    };
  </script>
</body>
</html>
